<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030519"/>
      <stop offset="50%" stop-color="#070C24"/>
      <stop offset="100%" stop-color="#00015D"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49CBE5"/>
      <stop offset="100%" stop-color="#0177B5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(73, 203, 229, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Glowing Orb -->
  <circle cx="550" cy="220" r="160" fill="url(#cyanBlue)" opacity="0.12" filter="url(#glow)"/>

  <!-- Device Board Illustration -->
  <rect x="80" y="80" width="380" height="340" rx="20" fill="#0C1338" stroke="rgba(73, 203, 229, 0.3)" stroke-width="1.5"/>
  <rect x="100" y="100" width="340" height="40" rx="8" fill="#111E3D"/>
  <circle cx="120" cy="120" r="5" fill="#EF4444"/>
  <circle cx="138" cy="120" r="5" fill="#EAB308"/>
  <circle cx="156" cy="120" r="5" fill="#22C55E"/>
  <text x="180" y="125" fill="#CBF0F8" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="1">ESP32 · SMART CONTROLLER</text>

  <!-- LCD Screen Graphic -->
  <rect x="100" y="160" width="340" height="110" rx="8" fill="#04081E" stroke="rgba(73, 203, 229, 0.2)"/>
  <text x="120" y="195" fill="#49CBE5" font-family="'Space Grotesk', monospace" font-size="14" font-weight="bold">SOIL MOISTURE: 72% [OPTIMAL]</text>
  <text x="120" y="225" fill="#94A3B8" font-family="'Space Grotesk', monospace" font-size="13">TEMP: 28.4°C  ·  HUMIDITY: 65%</text>
  <text x="120" y="250" fill="#22C55E" font-family="'Space Grotesk', monospace" font-size="12">PUMP [CH1]: OFF · SOLENOID A: READY</text>

  <!-- 4 Relays Status -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="75" height="45" rx="6" fill="#111E3D" stroke="rgba(73, 203, 229, 0.2)"/>
    <text x="12" y="20" fill="#94A3B8" font-size="10" font-family="sans-serif">CH1 WATER</text>
    <text x="12" y="36" fill="#22C55E" font-size="11" font-weight="bold" font-family="sans-serif">ACTIVE</text>

    <rect x="88" y="0" width="75" height="45" rx="6" fill="#111E3D" stroke="rgba(73, 203, 229, 0.2)"/>
    <text x="100" y="20" fill="#94A3B8" font-size="10" font-family="sans-serif">CH2 NPK-A</text>
    <text x="100" y="36" fill="#49CBE5" font-size="11" font-weight="bold" font-family="sans-serif">AUTO</text>

    <rect x="176" y="0" width="75" height="45" rx="6" fill="#111E3D" stroke="rgba(73, 203, 229, 0.2)"/>
    <text x="188" y="20" fill="#94A3B8" font-size="10" font-family="sans-serif">CH3 NPK-B</text>
    <text x="188" y="36" fill="#49CBE5" font-size="11" font-weight="bold" font-family="sans-serif">AUTO</text>

    <rect x="265" y="0" width="75" height="45" rx="6" fill="#111E3D" stroke="rgba(73, 203, 229, 0.2)"/>
    <text x="277" y="20" fill="#94A3B8" font-size="10" font-family="sans-serif">CH4 SPRAY</text>
    <text x="277" y="36" fill="#64748B" font-size="11" font-weight="bold" font-family="sans-serif">STANDBY</text>
  </g>

  <!-- Right Side Visual / Wave Telemetry -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="230" height="280" rx="16" fill="rgba(12, 19, 56, 0.85)" stroke="rgba(73, 203, 229, 0.2)"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="15">Firebase Telemetry</text>
    <circle cx="195" cy="33" r="4" fill="#22C55E"/>
    
    <!-- Wave chart -->
    <path d="M20 180 Q 60 110, 100 140 T 160 100 T 210 130" fill="none" stroke="#49CBE5" stroke-width="3"/>
    <path d="M20 180 Q 60 110, 100 140 T 160 100 T 210 130 L 210 220 L 20 220 Z" fill="url(#cyanBlue)" opacity="0.15"/>
    
    <text x="24" y="250" fill="#94A3B8" font-size="11" font-family="sans-serif">Sync Interval: 1000ms</text>
    <text x="24" y="265" fill="#49CBE5" font-size="12" font-family="'Space Grotesk', sans-serif" font-weight="600">RTDB: Connected</text>
  </g>

  <!-- Big Title Stamp -->
  <text x="500" y="425" fill="#49CBE5" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold" letter-spacing="2">FertiFlow</text>
  <text x="500" y="445" fill="#CBF0F8" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="3">PRECISION AGRI-IOT</text>
</svg>
