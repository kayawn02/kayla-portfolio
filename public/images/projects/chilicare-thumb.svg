<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C11"/>
      <stop offset="50%" stop-color="#052E16"/>
      <stop offset="100%" stop-color="#030519"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(34, 197, 94, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="280" cy="250" r="140" fill="url(#greenGlow)" opacity="0.15" filter="url(#glow)"/>

  <!-- Mobile Device Mockup / Scanner -->
  <g transform="translate(180, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="220" height="400" rx="28" fill="#030519" stroke="rgba(34, 197, 94, 0.4)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="10" y="24" width="200" height="350" rx="18" fill="#07190F"/>
    
    <!-- Top Bar -->
    <text x="24" y="50" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">ChiliCare AI</text>
    <circle cx="185" cy="46" r="3" fill="#22C55E"/>

    <!-- Viewfinder / Reticle Overlay -->
    <rect x="25" y="75" width="170" height="190" rx="12" fill="none" stroke="rgba(34, 197, 94, 0.4)" stroke-dasharray="8 4"/>
    
    <!-- Reticle Corners -->
    <path d="M35 85 L55 85 M35 85 L35 105" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M185 85 L165 85 M185 85 L185 105" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M35 255 L55 255 M35 255 L35 235" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M185 255 L165 255 M185 255 L185 235" stroke="#22C55E" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Leaf stylized graphic -->
    <path d="M110 130 C150 140, 160 210, 110 230 C60 210, 70 140, 110 130 Z" fill="#15803D" opacity="0.8"/>
    <line x1="110" y1="135" x2="110" y2="225" stroke="#86EFAC" stroke-width="1.5"/>

    <!-- Scan Line -->
    <line x1="30" y1="170" x2="190" y2="170" stroke="#4ADE80" stroke-width="2" opacity="0.9" filter="url(#glow)"/>

    <!-- Diagnostic Result Pill -->
    <rect x="25" y="280" width="170" height="42" rx="8" fill="#14532D" stroke="rgba(74, 222, 128, 0.3)"/>
    <text x="36" y="297" fill="#86EFAC" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">AI CONFIDENCE: 94.2%</text>
    <text x="36" y="313" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Status: Healthy Foliage</text>

    <!-- Scan Button -->
    <circle cx="110" cy="345" r="16" fill="#22C55E"/>
    <circle cx="110" cy="345" r="12" fill="#07190F"/>
    <circle cx="110" cy="345" r="8" fill="#22C55E"/>
  </g>

  <!-- Right Side Analytics Card -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="280" height="290" rx="16" fill="rgba(6, 36, 18, 0.85)" stroke="rgba(34, 197, 94, 0.3)"/>
    <text x="24" y="40" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">ChiliCare AI</text>
    <text x="24" y="60" fill="#86EFAC" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="1">PLANT PATHOLOGY COMPANION</text>

    <!-- Classification Breakdown -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="232" height="40" rx="8" fill="#052E16" stroke="rgba(34, 197, 94, 0.2)"/>
      <circle cx="20" cy="20" r="5" fill="#22C55E"/>
      <text x="35" y="24" fill="#FFFFFF" font-size="12" font-family="sans-serif">Healthy Capsicum</text>
      <text x="195" y="24" fill="#86EFAC" font-size="11" font-weight="bold" font-family="'Space Grotesk'">94%</text>
    </g>

    <g transform="translate(24, 140)">
      <rect x="0" y="0" width="232" height="40" rx="8" fill="#052E16" stroke="rgba(234, 179, 8, 0.2)"/>
      <circle cx="20" cy="20" r="5" fill="#EAB308"/>
      <text x="35" y="24" fill="#FFFFFF" font-size="12" font-family="sans-serif">Fusarium Wilt Early</text>
      <text x="195" y="24" fill="#FDE047" font-size="11" font-weight="bold" font-family="'Space Grotesk'">4%</text>
    </g>

    <g transform="translate(24, 190)">
      <rect x="0" y="0" width="232" height="40" rx="8" fill="#052E16" stroke="rgba(239, 68, 68, 0.2)"/>
      <circle cx="20" cy="20" r="5" fill="#EF4444"/>
      <text x="35" y="24" fill="#FFFFFF" font-size="12" font-family="sans-serif">Anthracnose / Spots</text>
      <text x="195" y="24" fill="#FCA5A5" font-size="11" font-weight="bold" font-family="'Space Grotesk'">2%</text>
    </g>

    <text x="24" y="265" fill="#94A3B8" font-size="11" font-family="sans-serif">Instant Remediation &amp; Treatment Guide</text>
  </g>
</svg>
