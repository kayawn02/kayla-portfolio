<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00015D"/>
      <stop offset="50%" stop-color="#0C1338"/>
      <stop offset="100%" stop-color="#0177B5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#neonGrad)"/>

  <!-- Diagonal dynamic geometric shapes -->
  <polygon points="120,0 380,0 260,500 0,500" fill="rgba(73, 203, 229, 0.08)"/>
  <polygon points="450,0 750,0 600,500 300,500" fill="rgba(1, 119, 181, 0.15)"/>
  
  <!-- Central Poster Frame -->
  <g transform="translate(220, 40)">
    <rect x="0" y="0" width="360" height="420" rx="14" fill="#030519" stroke="#49CBE5" stroke-width="2"/>
    
    <text x="35" y="65" fill="#CBF0F8" font-family="'Space Grotesk'" font-size="12" letter-spacing="4">TECHNOLOGY EXPO &amp; SYMPOSIUM</text>
    <text x="35" y="115" fill="#49CBE5" font-family="'Space Grotesk'" font-size="34" font-weight="900" letter-spacing="-1">INNOVATION</text>
    <text x="35" y="155" fill="#FFFFFF" font-family="'Space Grotesk'" font-size="34" font-weight="900" letter-spacing="-1">4 FORCE</text>

    <line x1="35" y1="180" x2="325" y2="180" stroke="#0177B5" stroke-width="3"/>

    <!-- Geometric Tech Motif -->
    <g transform="translate(35, 205)">
      <rect x="0" y="0" width="55" height="55" fill="#00015D" stroke="#49CBE5"/>
      <text x="27" y="34" text-anchor="middle" fill="#49CBE5" font-family="'Space Grotesk'" font-weight="bold" font-size="16">01</text>

      <rect x="75" y="0" width="55" height="55" fill="#00015D" stroke="#49CBE5"/>
      <text x="102" y="34" text-anchor="middle" fill="#49CBE5" font-family="'Space Grotesk'" font-weight="bold" font-size="16">02</text>

      <rect x="150" y="0" width="55" height="55" fill="#00015D" stroke="#49CBE5"/>
      <text x="177" y="34" text-anchor="middle" fill="#49CBE5" font-family="'Space Grotesk'" font-weight="bold" font-size="16">03</text>

      <rect x="225" y="0" width="55" height="55" fill="#00015D" stroke="#49CBE5"/>
      <text x="252" y="34" text-anchor="middle" fill="#49CBE5" font-family="'Space Grotesk'" font-weight="bold" font-size="16">04</text>
    </g>

    <text x="35" y="300" fill="#94A3B8" font-family="sans-serif" font-size="12">Keynote Talks · Interactive Booths · Prototype Pitch</text>
    <text x="35" y="325" fill="#CBF0F8" font-family="'Space Grotesk'" font-size="13" font-weight="600">500+ Attendees · 35+ Brand Collateral Assets</text>

    <!-- Badge -->
    <rect x="35" y="355" width="290" height="38" rx="6" fill="#111E3D" stroke="rgba(73, 203, 229, 0.3)"/>
    <text x="180" y="378" text-anchor="middle" fill="#49CBE5" font-family="'Space Grotesk'" font-size="11" font-weight="bold" letter-spacing="1">VISUAL IDENTITY &amp; ART DIRECTION</text>
  </g>
</svg>
